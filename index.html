<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 2em;
        }

        .image-container {
            margin: 30px 0;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .begging-image {
            max-width: 100%;
            max-height: 100%;
            border-radius: 15px;
            transition: all 0.3s ease;
        }

        .buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
            min-height: 80px;
        }

        button {
            padding: 15px 30px;
            border: none;
            border-radius: 50px;
            font-size: 1.2em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        #yesBtn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        #yesBtn:hover {
            transform: scale(1.05);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }

        #noBtn {
            background: #e0e0e0;
            color: #666;
        }

        #noBtn:hover {
            background: #d0d0d0;
        }

        .message {
            margin-top: 30px;
            margin-bottom: 20px;
            font-size: 1.1em;
            color: #666;
            font-style: italic;
        }

        .celebration {
            display: none;
            font-size: 1.8em;
            margin-top: 20px;
            color: #ff6b6b;
            font-weight: bold;
        }

        #noBtn {
            position: relative;
            transition: all 0.3s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .shake {
            animation: shake 0.3s ease;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        .float {
            animation: float 2s ease-in-out infinite;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 id="title">Bati na tayo? 🥺</h1>

        
        <div class="image-container">
            <img id="beggingImg" class="begging-image" src="" alt="Please forgive me">
        </div>

        <div class="buttons">
            <button id="yesBtn">Yes! ❤️</button>
            <button id="noBtn">No</button>
        </div>

        <p class="message" id="message">I'm really sorry... Please? 🥺</p>

        <div class="celebration" id="celebration">
            💕 Thank you love! 💕<br>
            <span style="font-size: 0.6em;">Promise babawi ako sayo! ❤️</span>
            
            <img 
                      id="yesCat" 
                      src="https://media1.tenor.com/m/_hUq1BSUsiMAAAAC/cat-cute.gif" 
                      alt="Cute cat"
                      style="display:none; max-width:100%; border-radius:15px; margin-top:20px;"
>

        </div>
    </div>

    <script>
        // Array of begging/pleading GIF URLs (using popular pleading images)
        const beggingImages = [
            'https://media.tenor.com/AKqNbzy45x8AAAAj/begging.gif', 
            'https://media.tenor.com/IxZpDCuRsPcAAAAi/amy-cat-cute-cat.gif', 
            'https://media.tenor.com/QLhuinUqt3gAAAAi/mutlu.gif', 
            'https://media1.tenor.com/m/3_yLIR4WKJ8AAAAC/sorry-im-sorry.gif', 
        ];

        let clickCount = 0;
        let yesBtnSize = 1;
        let noBtnSize = 1;

        const yesBtn = document.getElementById('yesBtn');
        const noBtn = document.getElementById('noBtn');
        const beggingImg = document.getElementById('beggingImg');
        const message = document.getElementById('message');
        const celebration = document.getElementById('celebration');
        const yesCat = document.getElementById('yesCat');
        const container = document.querySelector('.container');



        // Set initial image
        beggingImg.src = beggingImages[0];

        const messages = [
            "I'm really sorry... Please? 🥺",
            "Bati na tayo love 😢",
            "Wag ka na po mag tampo 💔",
            "Promise! babawi ako patawarin mo na ko Please!! 🙏",
            "My heart is breaking... 😭",
            "I can't live without your forgiveness! 💕",
            "Please, baby... I'm begging you! 🥺",
            "Look at me... How can you say no? 😢"
        ];

        noBtn.addEventListener('click', function() {
            clickCount++;
            
            // Shake the container
            container.classList.add('shake');
            setTimeout(() => container.classList.remove('shake'), 300);

            // After 4 clicks, hide the No button completely
            if (clickCount >= 4) {
                noBtn.style.display = 'none';
                message.textContent = "Tinanggal ko na yung 'No' wala kang choice kundi patawarin mo na ko 😎😎";
                // Change to the special cat GIF when No option is gone
                beggingImg.src = 'https://media.tenor.com/IecSz-S5-PEAAAAi/lol-chuckle.gif';
                return;
            }

            // Increase Yes button size
            yesBtnSize += 0.3;
            yesBtn.style.transform = `scale(${yesBtnSize})`;

            // Decrease No button size and move it away
            noBtnSize -= 0.15;
            if (noBtnSize < 0.3) noBtnSize = 0.3;
            noBtn.style.transform = `scale(${noBtnSize})`;
            
            // Move No button to the right to avoid overlap
            const moveDistance = clickCount * 15;
            noBtn.style.marginLeft = moveDistance + 'px';

            // Change image
            const imageIndex = Math.min(clickCount, beggingImages.length - 1);
            beggingImg.src = beggingImages[imageIndex];
            beggingImg.classList.add('float');

            // Change message
            const messageIndex = Math.min(clickCount, messages.length - 1);
            message.textContent = messages[messageIndex];

            // After many clicks, make No button very hard to click
            if (clickCount > 2) {
                noBtn.style.fontSize = '0.6em';
                noBtn.style.padding = '5px 10px';
            }

            if (clickCount > 2) {
                noBtn.textContent = "Really? 🥺";
            }
        });

   yesBtn.addEventListener('click', () => {
    document.getElementById('title').style.display = 'none';
    document.querySelector('.buttons').style.display = 'none';
    document.querySelector('.image-container').style.display = 'none';
    message.style.display = 'none';

    celebration.style.display = 'block';
    yesCat.style.display = 'block';

    document.body.style.background =
        'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)';

    createConfetti();
});



        function createConfetti() {
            const colors = ['#ff6b6b', '#4ecdc4', '#45b7d1', '#f7d794', '#ff8ed4'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.style.position = 'fixed';
                    confetti.style.width = '10px';
                    confetti.style.height = '10px';
                    confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.top = '-10px';
                    confetti.style.borderRadius = '50%';
                    confetti.style.zIndex = '1000';
                    document.body.appendChild(confetti);

                    let pos = -10;
                    const fall = setInterval(() => {
                        if (pos > window.innerHeight) {
                            clearInterval(fall);
                            confetti.remove();
                        } else {
                            pos += 5;
                            confetti.style.top = pos + 'px';
                            confetti.style.left = (parseFloat(confetti.style.left) + (Math.random() - 0.5) * 2) + '%';
                        }
                    }, 20);
                }, i * 30);
            }
        }
    </script>
</body>
</html>
